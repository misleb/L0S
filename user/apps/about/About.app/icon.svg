<?xml version="1.0" encoding="UTF-8"?>
<!-- L0S logo: L0 monogram on Adwaita dark_4, accent ring (port). Paths only. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c850"/>
      <stop offset="1" stop-color="#c9922a"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2438"/>
      <stop offset="0.5" stop-color="#241f31"/>
      <stop offset="1" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#plate)"/>
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="none" stroke="#3584e4" stroke-opacity="0.35" stroke-width="4"/>
  <!-- L -->
  <path fill="url(#amber)" d="M 128 128 h 48 v 224 h 160 v 48 H 128 Z"/>
  <!-- 0 ring -->
  <circle cx="344" cy="264" r="88" fill="none" stroke="url(#ring)" stroke-width="40"/>
  <circle cx="344" cy="264" r="14" fill="#3584e4"/>
  <!-- microkernel hint: three process tiles -->
  <rect x="148" y="392" width="56" height="36" rx="8" fill="#3d3846" stroke="#5e5c64" stroke-width="2"/>
  <rect x="228" y="392" width="56" height="36" rx="8" fill="#3d3846" stroke="#5e5c64" stroke-width="2"/>
  <rect x="308" y="392" width="56" height="36" rx="8" fill="#3d3846" stroke="#3584e4" stroke-width="2"/>
  <line x1="204" y1="410" x2="228" y2="410" stroke="#77767b" stroke-width="3" stroke-linecap="round"/>
  <line x1="284" y1="410" x2="308" y2="410" stroke="#77767b" stroke-width="3" stroke-linecap="round"/>
</svg>
