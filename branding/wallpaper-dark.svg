<?xml version="1.0" encoding="UTF-8"?>
<!-- Default L0S dark wallpaper: the old splash's palette, microkernel motif. Paths only. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#0c1c26"/>
      <stop offset="0.45" stop-color="#141828"/>
      <stop offset="1" stop-color="#241f31"/>
    </linearGradient>
    <radialGradient id="glow" cx="960" cy="400" r="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3584e4" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#3584e4" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#3584e4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c850"/>
      <stop offset="1" stop-color="#8c5e38"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#3d3846" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.45"/>

  <!-- Kernel hub and user-space processes (ports as dots, messages as lines) -->
  <circle cx="960" cy="520" r="5" fill="#3584e4"/>
  <circle cx="960" cy="520" r="140" fill="none" stroke="#3584e4" stroke-opacity="0.1" stroke-width="2"/>
  <g fill="#1e1a28" stroke="#5e5c64" stroke-width="2">
    <rect x="400" y="380" width="128" height="76" rx="12"/>
    <rect x="700" y="620" width="128" height="76" rx="12"/>
    <rect x="1092" y="620" width="128" height="76" rx="12"/>
    <rect x="1392" y="380" width="128" height="76" rx="12"/>
    <rect x="520" y="780" width="128" height="76" rx="12"/>
    <rect x="1272" y="780" width="128" height="76" rx="12"/>
  </g>
  <g stroke="#77767b" stroke-opacity="0.4" stroke-width="2" fill="none">
    <path d="M 464 418 L 960 520"/>
    <path d="M 764 658 L 960 520"/>
    <path d="M 1156 658 L 960 520"/>
    <path d="M 1456 418 L 960 520"/>
    <path d="M 584 818 L 960 520"/>
    <path d="M 1336 818 L 960 520"/>
  </g>
  <g fill="#3584e4" opacity="0.85">
    <circle cx="464" cy="418" r="5"/>
    <circle cx="764" cy="658" r="5"/>
    <circle cx="1156" cy="658" r="5"/>
    <circle cx="1456" cy="418" r="5"/>
    <circle cx="584" cy="818" r="5"/>
    <circle cx="1336" cy="818" r="5"/>
  </g>

  <!-- L0S title: block letters at 3×, centered -->
  <g transform="translate(552 252) scale(3)">
    <rect x="0" y="0" width="16" height="112" fill="url(#title)"/>
    <rect x="0" y="96" width="80" height="16" fill="url(#title)"/>
    <!-- 0: top/bottom span both verticals (80px); 64px bars read as D -->
    <rect x="104" y="0" width="80" height="16" fill="url(#title)"/>
    <rect x="104" y="96" width="80" height="16" fill="url(#title)"/>
    <rect x="104" y="0" width="16" height="112" fill="url(#title)"/>
    <rect x="168" y="0" width="16" height="112" fill="url(#title)"/>
    <rect x="208" y="0" width="64" height="16" fill="url(#title)"/>
    <rect x="208" y="0" width="16" height="48" fill="url(#title)"/>
    <rect x="208" y="48" width="64" height="16" fill="url(#title)"/>
    <rect x="256" y="64" width="16" height="48" fill="url(#title)"/>
    <rect x="208" y="96" width="64" height="16" fill="url(#title)"/>
  </g>
  <rect x="552" y="660" width="816" height="12" fill="#8c5e38"/>

  <!-- Tagline; rects only for svg.l0 -->
  <g fill="#96aad2">
    <rect x="668" y="756" width="584" height="3"/>
    <rect x="720" y="768" width="480" height="3" opacity="0.6"/>
  </g>

  <!-- Top-left corner the ground's color (#0c1c26), for letterboxing -->
  <rect x="0" y="0" width="4" height="4" fill="#0c1c26"/>
</svg>
